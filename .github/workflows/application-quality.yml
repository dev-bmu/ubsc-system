name: Required application quality

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contract and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CACHE_STORE: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: array
      PAYMENT_GATEWAY_MOCK: "true"
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: bcmath, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate locked dependency metadata
        run: composer validate --no-check-publish --strict

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject vulnerable PHP dependencies
        run: composer audit --locked

      - name: Parse every tracked PHP source file
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

      - name: Run complete isolated regression suite
        run: php artisan test

  frontend:
    name: Frontend type, dependency, and release build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install the exact JavaScript lockfile
        run: npm ci --ignore-scripts

      - name: Reject high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Parse operational JavaScript and shell entrypoints
        run: |
          for script in scripts/*.mjs; do node --check "$script"; done
          bash -n deploy/scripts/*.sh

      - name: Build and verify production assets
        run: npm run build

  required-quality:
    name: Required application quality
    if: always()
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality lane
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
