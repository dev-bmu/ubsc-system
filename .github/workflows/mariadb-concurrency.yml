name: Critical multi-process concurrency

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: mariadb-concurrency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-concurrency:
    # Keep this job name stable so it can be selected as a required status
    # check in the repository ruleset/branch-protection settings.
    name: Required multi-process concurrency (MariaDB/InnoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CACHE_STORE: database
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ubsc_race_ci_${{ github.run_id }}_${{ github.run_attempt }}
      DB_USERNAME: root
      DB_PASSWORD: concurrency_only
      DB_STRICT_MODE: "true"

    services:
      mariadb:
        image: mariadb:10.11.18@sha256:8020e05c4c498d06c87f0a1db010eb79bd6f8fb30e9b763d4690c34ce1e61008
        env:
          MARIADB_DATABASE: ubsc_race_ci_${{ github.run_id }}_${{ github.run_attempt }}
          MARIADB_ROOT_PASSWORD: concurrency_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --host=127.0.0.1 --user=root --password=concurrency_only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify protected branch concurrency governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/verify-github-concurrency-gate.mjs --rules-only

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: bcmath, dom, fileinfo, gd, intl, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate high-availability application contracts
        run: >-
          vendor/bin/phpunit
          tests/Unit/HighAvailabilityContractTest.php
          tests/Unit/DatabaseReplicationContractTest.php
          tests/Unit/DatabaseWriterProbeTest.php
          tests/Unit/HighAvailabilityProbeTest.php
          --stop-on-failure

      - name: Refuse any non-isolated database
        run: >-
          php -r '$name = (string) getenv("DB_DATABASE");
          if (preg_match("/\Aubsc_race_[a-z0-9_]+\z/", $name) !== 1) {
              fwrite(STDERR, "Refusing concurrency CI database: {$name}\n");
              exit(1);
          }'

      - name: Verify real MariaDB with InnoDB row locking
        run: |
          php -r '
          $dsn = sprintf(
              "mysql:host=%s;port=%s;dbname=%s;charset=utf8mb4",
              getenv("DB_HOST"),
              getenv("DB_PORT"),
              getenv("DB_DATABASE"),
          );
          $pdo = new PDO($dsn, getenv("DB_USERNAME"), getenv("DB_PASSWORD"), [
              PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
          ]);
          $version = (string) $pdo->query("SELECT VERSION()")?->fetchColumn();
          $engine = (string) $pdo->query("SELECT @@default_storage_engine")?->fetchColumn();
          if (stripos($version, "mariadb") === false || strcasecmp($engine, "InnoDB") !== 0) {
              fwrite(STDERR, "Concurrency gate requires MariaDB/InnoDB; got {$version} / {$engine}.\n");
              exit(1);
          }
          fwrite(STDOUT, "Concurrency database verified: MariaDB / InnoDB.\n");
          '

      - name: Migrate isolated race database
        run: php artisan migrate --force --no-interaction

      - name: Validate recovery and replication control planes on real MariaDB
        run: >-
          vendor/bin/phpunit
          --configuration phpunit.mariadb.xml
          tests/Feature/RecoveryEvidenceTest.php
          tests/Feature/DatabaseReplicationControlPlaneTest.php
          tests/Unit/DisasterRecoveryContractTest.php
          tests/Unit/DatabaseReplicationContractTest.php
          tests/Unit/RecoveryAttestationInteropTest.php
          tests/Unit/DatabaseReplicationAttestationInteropTest.php
          tests/Unit/DeploymentArtifactTest.php
          --stop-on-failure

      - name: Run small multi-process concurrency suite
        run: >-
          vendor/bin/phpunit
          --configuration phpunit.mariadb.xml
          tests/Integration/MariaDbBookingConcurrencyTest.php
          tests/Integration/MariaDbReplicationControlPlaneConcurrencyTest.php
          tests/Integration/MariaDbRecoveryLedgerConcurrencyTest.php
          tests/Integration/MariaDbResilienceLedgerConcurrencyTest.php
          --stop-on-failure
