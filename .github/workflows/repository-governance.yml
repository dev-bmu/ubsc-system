name: Repository governance audit

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  governance:
    name: Audit protected branch governance
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out verifier-only repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Verify protected branch governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/verify-github-concurrency-gate.mjs --rules-only
