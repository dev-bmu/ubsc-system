name: Repository governance audit

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  governance:
    name: Audit protected branch governance
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out verifier-only repository state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Verify protected branch governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/verify-github-concurrency-gate.mjs --rules-only
